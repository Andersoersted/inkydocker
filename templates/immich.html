{% extends "base.html" %}
{% block title %}Immich - InkyDocker{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row">
    <div class="col-md-4">
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-light">
          <h2 class="h5 mb-0">Immich Configuration</h2>
        </div>
        <div class="card-body">
          <form id="immichConfigForm">
            <div class="mb-3">
              <label for="immichAddress" class="form-label">Immich Address</label>
              <input type="text" class="form-control" id="immichAddress" value="{{ config.address if config else '' }}">
            </div>
            <div class="mb-3">
              <label for="immichApiKey" class="form-label">API Key</label>
              <input type="text" class="form-control" id="immichApiKey" value="{{ config.api_key if config else '' }}">
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <div id="immichConfigStatus" class="mt-2"></div>
          </form>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-header bg-light">
          <h2 class="h6 mb-0">Galleries</h2>
        </div>
        <div class="card-body">
          <button id="refreshGalleries" class="btn btn-sm btn-secondary mb-2">Refresh</button>
          <ul id="galleryList" class="list-group list-group-flush">
            {% for g in galleries %}
              <li class="list-group-item" data-id="{{ g.gallery_id }}">{{ g.name }}</li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </div>
    <div class="col-md-8">
      <div id="immichAssets" class="gallery"></div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='immich.js') }}" defer></script>
{% endblock %}
